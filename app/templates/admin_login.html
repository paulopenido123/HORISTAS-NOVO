<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Lifemax</title><style>body{margin:0;background:#082A3D;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{background:#fff;width:min(390px,calc(100% - 32px));padding:32px;border-radius:16px}h1{color:#082A3D;margin:0 0 6px}p{color:#62788A;font-size:14px}input{width:100%;padding:12px;border:1px solid #dce6e8;border-radius:8px;box-sizing:border-box;margin:10px 0 16px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#10AFA9;color:#fff;font-weight:700}.erro{background:#fbeaea;color:#b33;padding:10px;border-radius:8px;margin-bottom:10px;font-size:13px}</style></head><body><div class="card"><h1>Lifemax Admin</h1><p>Painel administrativo</p>{% if erro %}<div class="erro">{{ erro }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="password" name="senha" placeholder="Senha administrativa" required autofocus><button>Entrar</button></form></div></body></html>
