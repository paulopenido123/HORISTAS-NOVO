<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="csrf-token" content="{{ csrf_token() }}"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz de Agendamento — Lifemax</title><style>body{margin:0;background:#F5F8FA;font-family:Inter,Arial;color:#102A43}.top{background:#082A3D;color:white;padding:18px 28px}.nav{background:#fff;padding:14px 28px;border-bottom:1px solid #e3ebef}.nav a{margin-right:18px;color:#0B3A52;text-decoration:none;font-weight:600}.wrap{max-width:1280px;margin:auto;padding:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:white;border:1px solid #e3ebef;padding:16px;border-radius:14px}.toolbar label{font-size:12px;font-weight:700;color:#62788A}.toolbar select,.toolbar input{padding:10px;border:1px solid #d5e0e5;border-radius:8px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#10AFA9;color:white;font-weight:700}.matrix{margin-top:18px;background:white;border:1px solid #d8e3e7;border-radius:14px;overflow:auto}.grid{display:grid;grid-template-columns:76px repeat(7,minmax(120px,1fr));min-width:920px}.cell{min-height:30px;padding:2px 4px;border-right:1px solid #d8e3e7;border-bottom:1px solid #d8e3e7;display:grid;place-items:center;font-size:11px;line-height:1.15}.head{background:#edf4f7;font-weight:800;min-height:38px}.hour{font-weight:800;background:#fff}.slot{cursor:pointer;font-weight:600}.slot.available{background:#9BE79A}.slot.reserved{background:#FFB8C0;color:#8e2632}.slot.confirmed{background:#22A7C5;color:white}.slot.unavailable{background:#C8CDD1;color:#53616a;cursor:not-allowed}.legend{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;font-size:12px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:14px;height:14px;border-radius:4px}.green{background:#9BE79A}.pink{background:#FFB8C0}.gray{background:#C8CDD1}.blue{background:#22A7C5}.btn-semana{padding:10px 14px;border:1px solid #d5e0e5;border-radius:8px;background:#fff;color:#082A3D;font-weight:800;cursor:pointer;font-size:14px}.btn-replicar{background:#082A3D}.status-replicar{font-size:12.5px;margin-top:10px;padding:10px 12px;border-radius:8px}.status-replicar.ok{background:#E3F7EE;color:#0B7B45}.status-replicar.aviso{background:#FFF4E0;color:#8a5a00}</style></head><body><div class="top"><strong>LIFEMAX ADMIN · MATRIZ DE AGENDAMENTO</strong></div><div class="nav"><a href="{{ url_for('admin.dashboard') }}">Dashboard</a><a href="{{ url_for('admin.agenda_horistas') }}">Agenda Horistas</a><a href="{{ url_for('admin.consultorios') }}">Consultórios</a><a href="{{ url_for('admin.clientes') }}">Clientes</a><a href="{{ url_for('admin.horas') }}">Horas</a><a href="{{ url_for('admin.relatorios') }}">Relatórios</a><a href="{{ url_for('admin.admin_logout') }}">Sair</a></div><div class="wrap"><h1>Matriz de Agendamento</h1><p>Marque os horários que já estão reservados. Os demais horários liberados ficam verdes para os médicos.</p><div class="toolbar"><div><label>Consultório</label><br><select id="consultorio">{% for c in consultorios %}<option value="{{ c.id }}">{{ c.nome }}</option>{% endfor %}</select></div><div><label>Semana</label><br><input type="date" id="inicio"></div><button type="button" class="btn-semana" onclick="mudarSemana(-7)" title="Semana anterior">&larr;</button><button type="button" class="btn-semana" onclick="mudarSemana(7)" title="Próxima semana">&rarr;</button><button class="btn" onclick="carregar()">Gerar matriz</button><button type="button" class="btn btn-replicar" onclick="replicarUltimaMatriz()">Replicar última matriz para próxima semana</button></div><div id="status-replicar"></div><div class="matrix"><div class="grid" id="grid"></div></div><div class="legend"><span><i class="dot green"></i>Disponível</span><span><i class="dot pink"></i>Reservado</span><span><i class="dot gray"></i>Indisponível</span><span><i class="dot blue"></i>Reserva confirmada</span></div></div><script>const H=['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:30','18:30','19:30'];const D=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const ini=document.getElementById('inicio');ini.value=new Date().toISOString().slice(0,10);function addDays(s,n){let d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}async function carregar(){let cid=document.getElementById('consultorio').value, start=ini.value;let r=await fetch(`/admin/api/matriz?consultorio_id=${cid}&data_inicio=${start}`);let x=await r.json();let holds=new Map((x.holds||[]).map(v=>[v.data+'|'+v.horario.slice(0,5),v]));let blocked=new Set();(x.bloqueios||[]).forEach(b=>{for(let i=0;i<7;i++){let d=addDays(start,i),dt=new Date(d+'T00:00:00');if(dt.getDay()===b.dia_semana) blocked.add(d+'|'+b.hora_inicio.slice(0,5));}});let reservas=new Map();(x.reservas||[]).forEach(v=>{let s=v.hora_inicio&&v.hora_inicio.slice(0,5);if(s){let q=v.quantidade_horas||1;for(let i=0;i<q;i++){let hh=Number(s.slice(0,2))+i;reservas.set(v.data+'|'+String(hh).padStart(2,'0')+':00',v)}}});let html='<div class="cell head">Horário</div>';for(let i=0;i<7;i++){let d=addDays(start,i),dt=new Date(d+'T00:00:00');html+=`<div class="cell head">${D[dt.getDay()]}<br>${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}</div>`}H.forEach(h=>{html+=`<div class="cell hour">${h}</div>`;for(let i=0;i<7;i++){let d=addDays(start,i),k=d+'|'+h,v=reservas.get(k),hold=holds.get(k);let cls=v?'confirmed':hold?'reserved':blocked.has(k)?'unavailable':'available';html+=`<div class="cell slot ${cls}" ${cls==='unavailable'?'':'onclick="toggle(\''+d+'\',\''+h+'\',this)"'}>${v?(v.medicos?.nome||'Reserva'):hold?'Reservado':blocked.has(k)?'—':'Disponível'}</div>`}});document.getElementById('grid').innerHTML=html}async function toggle(data,h,el){let cid=document.getElementById('consultorio').value;if(el.classList.contains('confirmed'))return alert('Este horário já possui reserva confirmada.');let r=await fetch('/admin/api/matriz/toggle',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('meta[name=csrf-token]').content},body:JSON.stringify({consultorio_id:cid,data,horario:h})});let x=await r.json();if(x.status==='reservado'){el.classList.remove('available');el.classList.add('reserved');el.textContent='Reservado'}else{el.classList.remove('reserved');el.classList.add('available');el.textContent='Disponível'}}
// Botões "<" e ">" -- pedido do Paulo em 10/09/2026: move a semana exibida
// pra frente/trás 7 dias e já recarrega a matriz.
function mudarSemana(dias){ini.value=addDays(ini.value,dias);carregar()}
// "Replicar última matriz para próxima semana" -- pedido do Paulo em
// 10/09/2026: copia os horários marcados como reservados pelo admin
// (células rosa) da semana ANTERIOR à que está sendo exibida agora pra
// semana atual, em todos os consultórios. Fluxo pensado por ele: clica em
// ">" pra ir pra próxima semana, depois clica aqui -- dá pra repetir
// semana em semana, porque a origem é sempre "a semana anterior à que a
// tela está mostrando", não uma semana fixa.
async function replicarUltimaMatriz(){
  const statusEl=document.getElementById('status-replicar');
  statusEl.className='status-replicar';statusEl.textContent='Replicando...';
  try{
    const r=await fetch('/admin/api/matriz/replicar',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('meta[name=csrf-token]').content},body:JSON.stringify({data_inicio:ini.value})});
    const x=await r.json();
    if(!r.ok){statusEl.className='status-replicar aviso';statusEl.textContent=x.erro||'Não consegui replicar a matriz.';return}
    if(x.aviso){statusEl.className='status-replicar aviso';statusEl.textContent=x.aviso;return}
    statusEl.className='status-replicar ok';
    statusEl.textContent=`${x.replicados} horário(s) replicado(s) da semana de ${x.data_inicio_origem} pra semana de ${x.data_inicio_destino}`+(x.pulados?` (${x.pulados} já existiam e foram pulados).`:'.');
    carregar();
  }catch(e){statusEl.className='status-replicar aviso';statusEl.textContent='Erro ao replicar: '+e;}
}
carregar();</script></body></html>
