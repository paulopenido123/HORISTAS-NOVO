<!doctype html><html lang="pt-BR"><head><link rel="icon" href="/static/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários — Lifemax Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#F5F8F9;font-family:'Inter',Arial,sans-serif;color:#10222E}
*{box-sizing:border-box}
.hero{background:linear-gradient(160deg,#0A3650 0%,#0B4A5F 55%,#0C5867 100%);color:#fff;border-radius:0 0 34px 34px;padding:30px 18px 96px;text-align:center}
.logo{height:60px;width:auto;display:inline-block;background:#fff;border-radius:18px;padding:11px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.eyebrow{margin-top:18px;font-size:12.5px;font-weight:700;letter-spacing:.05em;color:#34D2CC;text-transform:uppercase}
h1{margin:2px 0 0;font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(28px,7vw,38px);line-height:1.1}
.hero p{margin:8px auto 0;font-size:14.5px;color:rgba(234,242,245,.9)}
.card{position:relative;background:#fff;border-radius:22px;box-shadow:0 8px 26px rgba(11,58,87,.14);padding:24px 20px;width:calc(100% - 24px);max-width:440px;margin:-64px auto 30px}
label{display:block;font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px;color:#6B8493}
input{width:100%;height:52px;padding:0 14px;border:1px solid #DCE6EA;background:#F7FAFB;border-radius:14px;font-family:inherit;font-size:16px;margin-bottom:16px}
input:focus{outline:2px solid #0EA5A0;outline-offset:1px;background:#fff}
button{width:100%;height:54px;border:0;border-radius:14px;background:#0EA5A0;color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;cursor:pointer}
button:hover{background:#0C8B87}
.erro{background:#FDECEA;color:#C62A1B;padding:12px 14px;border-radius:14px;margin-bottom:16px;font-size:14px;font-weight:600}
</style><link rel="stylesheet" href="/static/css/base-mobile.css"></head><body>
<header class="hero"><img class="logo" src="{{ url_for('static', filename='images/logo-light.png') }}" alt="Lifemax"><div class="eyebrow">Administrador</div><h1>{{ titulo_gate or 'Usuários' }}</h1><p>Área protegida. Digite o código master.</p></header>
<div class="card">{% if erro %}<div class="erro">{{ erro }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="master">Código senha master</label><input id="master" type="password" name="master" autocomplete="off" required autofocus><button>Acessar</button></form><p style="text-align:center;margin:16px 0 0"><a href="{{ url_for('admin.dashboard') }}" style="color:#0EA5A0;font-weight:700;text-decoration:none">← Voltar ao painel</a></p></div>
</body></html>
