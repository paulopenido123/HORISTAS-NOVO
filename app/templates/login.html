<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Lifemax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0E2A3B; --navy-soft: #15425C; --teal: #0EA5A0; --line: #DCE6E8; --muted: #55707C; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', -apple-system, sans-serif; background: linear-gradient(160deg, var(--navy), var(--navy-soft));
    padding: 20px;
  }
  .card { background: white; border-radius: 16px; padding: 32px; width: 100%; max-width: 380px; }
  h1 { margin: 0 0 4px; font-size: 20px; color: var(--navy); }
  .login-logo { height: 28px; width: auto; display: block; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; font-size: 13px; color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  input {
    width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--line);
    font-family: inherit; font-size: 14px; margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  button {
    width: 100%; background: var(--navy); color: white; border: none; padding: 12px;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: 0.92; }
  .erro { background: #fbeae6; color: #D65C3F; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .rodape { text-align: center; margin-top: 18px; font-size: 13px; }
  .rodape a { color: var(--teal); text-decoration: none; font-weight: 600; }

  h1, h2, h3, .brand, header h1 { font-family: 'Manrope', sans-serif; }

  @media (max-width: 480px) {
    body { padding: 16px; }
    .card { max-width: 100%; padding: 24px 20px; border-radius: 14px; }
    h1 { font-size: 18px; }
  }
</style>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0E2A3B">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifemax">
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/static/service-worker.js").catch(() => {});
  });
}
</script>
</head>
<body>
  <div class="card">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Lifemax" class="login-logo">
    <p class="sub">Entre com seu telefone e senha</p>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensagens %}
        <div class="erro">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}

    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="telefone">Telefone (com DDD)</label>
      <input type="text" id="telefone" name="telefone" placeholder="31999999999" required autofocus>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>

      <button type="submit">Entrar</button>
    </form>

    <div class="rodape">
      Primeiro acesso? <a href="{{ url_for('auth.primeiro_acesso') }}">Criar senha</a>
    </div>
    <div class="rodape">
      <a href="{{ url_for('auth.esqueci_senha') }}">Esqueci minha senha</a>
    </div>
  </div>
</body>
</html>
